
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Radar & Weather Hub</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #060814; color: #E2E8F0; }
        .nav-bar { background: #0F1123; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #8B5CF6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
        .workspace { padding: 20px; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #0F1123; padding: 20px; border-radius: 12px; border: 1px solid #1F2937; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h3, h4 { margin-top: 0; color: #F1F5F9; letter-spacing: 0.5px; }
        .neon-text-blue { color: #38BDF8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        .neon-text-purple { color: #A78BFA; text-shadow: 0 0 8px rgba(167, 139, 250, 0.4); }
        .btn { border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 13px; transition: all 0.2s; }
        .btn-primary { background: #2563EB; box-shadow: 0 0 10px rgba(37, 99, 235, 0.4); }
        .btn-primary:hover { background: #1D4ED8; }
        .btn-accent { background: #8B5CF6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
        .btn-accent:hover { background: #7C3AED; }
        .btn-danger { background: #EF4444; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        input, select { padding: 12px; background: #060814; border: 1px solid #374151; color: white; border-radius: 8px; font-size: 14px; }
        input:focus { border-color: #8B5CF6; outline: none; }
        .radar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .radar-card { background: #151833; padding: 16px; border-radius: 10px; border: 1px solid #2D3748; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .radar-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #38BDF8; }
        .weather-badge { background: rgba(56, 189, 248, 0.15); color: #38BDF8; padding: 4px 8px; font-size: 12px; border-radius: 6px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .geo-box { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <h2 style="margin:0; font-size:20px;" class="neon-text-purple">📡 SQUAD RADAR NODE</h2>
        <span style="font-size: 12px; background: #1F2937; padding: 6px 12px; border-radius: 20px; border: 1px solid #374151;">Online Hub</span>
    </div>

    <div class="workspace">
        
        <div class="card" style="border-color: #8B5CF6;">
            <h3 class="neon-text-purple">📍 Core Geolocation Station</h3>
            <p style="font-size: 13px; color: #94A3B8; margin: 0 0 15px 0;">Initialize your live satellite coordinate logs to compute distances to incoming squad targets.</p>
            
            <div class="geo-box">
                <div style="display: flex; justify-content: space-between; font-size: 14px;">
                    <span>Latitude: <strong id="myLat" style="color:#A78BFA;">Not Loaded</strong></span>
                    <span>Longitude: <strong id="myLng" style="color:#A78BFA;">Not Loaded</strong></span>
                </div>
                <div id="myWeatherDisplay" class="weather-badge style-block" style="display:none;">Loading Local Weather...</div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="getMyLocation()">⚡ Scan My GPS Coordinates</button>
                <a id="mapLink" href="#" target="_blank" class="btn btn-accent" style="text-decoration: none; text-align: center; display: none;">🗺️ Open Maps View</a>
            </div>
        </div>

        <div class="card" style="border-color: #1F2937;">
            <h3 class="neon-text-blue">➕ Register Friend Coordinates</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; align-items: end;">
                <div class="form-group">
                    <label style="font-size: 12px; color: #94A3B8;">Friend Name</label>
                    <input type="text" id="friendName" placeholder="e.g., Rohan">
                </div>
                <div class="form-group">
                    <label style="font-size: 12px; color: #94A3B8;">Target Lat</label>
                    <input type="number" id="friendLat" step="0.0001" placeholder="18.4085">
                </div>
                <div class="form-group">
                    <label style="font-size: 12px; color: #94A3B8;">Target Lng</label>
                    <input type="number" id="friendLng" step="0.0001" placeholder="76.5604">
                </div>
            </div>
            <button class="btn btn-accent" style="width: 100%; margin-top: 15px;" onclick="addFriendNode()">📡 Add Target to Radar</button>
        </div>

        <div class="card">
            <h3 class="neon-text-blue">🌐 Active Squad Radar Grid</h3>
            <div id="radarGrid" class="radar-grid">
                </div>
        </div>

    </div>

    <script>
        // Internal Memory Vault for tracking coordinates
        let myCoordinates = { lat: null, lng: null };
        let squadList = JSON.parse(localStorage.getItem('radar_squad_db')) || [
            { name: "Sample Target (Mumbai)", lat: 19.0760, lng: 72.8777 },
            { name: "Sample Target (Pune)", lat: 18.5204, lng: 73.8567 }
        ];

        // Core Step 1: Query Browser Geolocation GPS Pipeline
        function getMyLocation() {
            if (!navigator.geolocation) {
                alert("Your device browser blockaded GPS coordinates fetching updates.");
                return;
            }
            navigator.geolocation.getCurrentPosition(position => {
                myCoordinates.lat = position.coords.latitude;
                myCoordinates.lng = position.coords.longitude;
                
                document.getElementById('myLat').innerText = myCoordinates.lat.toFixed(4);
                document.getElementById('myLng').innerText = myCoordinates.lng.toFixed(4);
                
                // Show dynamic map navigation anchor link
                const mapBtn = document.getElementById('mapLink');
                mapBtn.href = `https://www.google.com/maps?q=${myCoordinates.lat},${myCoordinates.lng}`;
                mapBtn.style.display = "block";
                
                // Pull active weather parameters based on real position
                fetchSimulatedWeather('myWeatherDisplay', myCoordinates.lat);
                
                // Recalculate range intervals for standard grid array
                renderRadar();
            }, () => {
                alert("Failed to capture location coordinates. Please enable site permissions.");
            });
        }

        // Core Step 2: Formulate Math Distance Vectors (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1) return "Unknown (Scan GPS)";
            const R = 6371; // Earth's Radius line vector parameter in Kilometers
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            return `${distance.toFixed(1)} km away`;
        }

        // Core Step 3: Fetch Weather Parameters Loop
        function fetchSimulatedWeather(elementId, seedLat) {
            const element = document.getElementById(elementId);
            element.style.display = "inline-block";
            
            // Simulating real dynamic feeds based on coordinate inputs safely
            const baselineTemp = 28 + Math.floor((seedLat % 1) * 10);
            const weatherConditions = ["Clear Skies ☀️", "Passing Clouds ⛅", "Scattered Showers 🌧️", "Overcast ☁️"];
            const chosenCondition = weatherConditions[Math.floor(Math.abs(seedLat) % weatherConditions.length)];
            
            element.innerText = `🌤️ Weather: ${baselineTemp}°C | ${chosenCondition}`;
        }

        // Core Step 4: Inject & Retain Target Elements
        function addFriendNode() {
            const name = document.getElementById('friendName').value.trim();
            const lat = parseFloat(document.getElementById('friendLat').value);
            const lng = parseFloat(document.getElementById('friendLng').value);
            
            if (!name || isNaN(lat) || isNaN(lng)) {
                alert("Please fill out complete positioning fields accurately.");
                return;
            }
            
            squadList.push({ name: name, lat: lat, lng: lng });
            localStorage.setItem('radar_squad_db', JSON.stringify(squadList));
            
            // Clear input fields
            document.getElementById('friendName').value = '';
            document.getElementById('friendLat').value = '';
            document.getElementById('friendLng').value = '';
            
            renderRadar();
        }

        function removeFriendNode(idx) {
            squadList.splice(idx, 1);
            localStorage.setItem('radar_squad_db', JSON.stringify(squadList));
            renderRadar();
        }

        // Render Panel Items Interface Loop
        function renderRadar() {
            const grid = document.getElementById('radarGrid');
            grid.innerHTML = '';
            
            if(squadList.length === 0) {
                grid.innerHTML = '<p style="color:#64748B; font-size:13px; padding:10px;">Radar scope clear. No squadron tracked.</p>';
                return;
            }
            
            squadList.forEach((friend, idx) => {
                const distanceText = calculateDistance(myCoordinates.lat, myCoordinates.lng, friend.lat, friend.lng);
                const weatherUniqueId = `weather-friend-${idx}`;
                
                grid.innerHTML += `
                    <div class="radar-card">
                        <div>
                            <h4 style="margin:0 0 6px 0; color:#38BDF8;">👤 ${friend.name}</h4>
                            <p style="font-size:12px; color:#A78BFA; margin:4px 0; font-weight:bold;">🛰️ ${distanceText}</p>
                            <p style="font-size:11px; color:#64748B; margin:0;">Position: ${friend.lat.toFixed(3)}, ${friend.lng.toFixed(3)}</p>
                            <div id="${weatherUniqueId}" class="weather-badge">Syncing target weather...</div>
                        </div>
                        <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
                            <a href="https://www.google.com/maps?q=${friend.lat},${friend.lng}" target="_blank" style="font-size:11px; color:#38BDF8; text-decoration:none; font-weight:bold;">Track Path ➔</a>
                            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="removeFriendNode(${idx})">Drop</button>
                        </div>
                    </div>
                `;
                
                // Fire dynamic weather calculation sequence for each array card node
                setTimeout(() => {
                    fetchSimulatedWeather(weatherUniqueId, friend.lat);
                }, 50);
            });
        }

        // Initialize display configuration state elements instantly
        window.onload = renderRadar;
    </script>
</body>
</html>
