<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calorie Counter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🍎 AI Calorie Counter</h1>

    <p>
        Upload a food image and let AI estimate its calories.
    </p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <img
        id="preview"
        alt="Food Preview"
    >

    <button onclick="analyzeFood()">
        🤖 Analyze Food
    </button>

    <div
        id="loading"
        class="loading"
    >
        ⏳ Analyzing image...
    </div>

    <div
        id="result"
        class="result"
    >
        <!-- AI Result Appears Here -->
    </div>

    <footer>
        Made with ❤️ using HTML, CSS & JavaScript
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
