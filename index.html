
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Live Matrix Radar</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #05070F; color: #E2E8F0; }
        .nav-bar { background: #0B0E1A; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #38BDF8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); }
        .workspace { padding: 20px; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #0B0E1A; padding: 20px; border-radius: 12px; border: 1px solid #1F2937; }
        h3, h4 { margin-top: 0; letter-spacing: 0.5px; }
        .neon-blue { color: #38BDF8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        .neon-purple { color: #A78BFA; text-shadow: 0 0 8px rgba(167, 139, 250, 0.4); }
        .btn { border: none; padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 13px; transition: all 0.2s; }
        .btn-blue { background: #2563EB; box-shadow: 0 0 10px rgba(37, 99, 235, 0.3); }
        .btn-purple { background: #8B5CF6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .btn-danger { background: #EF4444; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        input { padding: 12px; background: #05070F; border: 1px solid #374151; color: white; border-radius: 8px; font-size: 14px; }
        input:focus { border-color: #38BDF8; outline: none; }
        
        /* Progress meter bar styling */
        .meter-container { background: #1F2937; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; border: 1px solid #374151; }
        .meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #38BDF8, #8B5CF6); transition: width 0.5s ease-in-out; }
        
        .radar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .radar-card { background: #13172B; padding: 16px; border-radius: 10px; border: 1px solid #242B4D; display: flex; flex-direction: column; justify-content: space-between; }
        .identity-badge { background: rgba(139, 92, 246, 0.2); border: 1px solid #8B5CF6; padding: 8px 12px; border-radius: 8px; font-family: monospace; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <h2 style="margin:0; font-size:18px;" class="neon-blue">📡 LIVE SQUAD TELEMETRY</h2>
        <span style="font-size: 11px; background: #111827; padding: 6px 12px; border-radius: 20px; color: #34D399; border: 1px solid #1F2937;">Radar Online</span>
    </div>

    <div class="workspace">
        
        <div class="card" style="border-color: #8B5CF6;">
            <h3 class="neon-purple">🔑 Your Core Transmitter Node</h3>
            <p style="font-size: 13px; color: #94A3B8; margin-top: 0;">Share this exact code string with your friends so they can track your live distance metric.</p>
            
            <div class="identity-badge">
                <span>TRANSMITTER KEY:</span>
                <strong id="myTrackingCode" style="color:#A78BFA;">Generating Key...</strong>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-purple" style="flex: 1;" onclick="activateMyGPS()">🛰️ Initialize Live Satellite Broadcast</button>
            </div>
            <p id="myCoordinateStats" style="font-size: 11px; color: #64748B; margin: 8px 0 0 0; text-align: center;"></p>
        </div>

        <div class="card" style="border-color: #38BDF8;">
            <h3 class="neon-blue">🎯 Connect Target Friend Code</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: end;">
                <div class="form-group">
                    <label style="font-size: 11px; color: #94A3B8;">Target Tracking Code</label>
                    <input type="text" id="targetFriendCode" placeholder="e.g., SQUAD-4321">
                </div>
                <button class="btn btn-blue" style="height: 44px;" onclick="connectTargetFriend()">📡 Lock Target</button>
            </div>
        </div>

        <div class="card">
            <h3 class="neon-blue">🌐 Active Squad Telemetry</h3>
            <div id="radarScopeGrid" class="radar-grid"></div>
        </div>

    </div>

    <script>
        // Unique persistent code generation sequence
        if(!localStorage.getItem('matrix_my_id_code')) {
            const randomId = Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('matrix_my_id_code', `SQUAD-${randomId}`);
        }
        const myUniqueCode = localStorage.getItem('matrix_my_id_code');
        document.getElementById('myTrackingCode').innerText = myUniqueCode;

        let myLat = null, myLng = null;
        let trackedFriends = JSON.parse(localStorage.getItem('matrix_tracked_friends')) || [];

        function activateMyGPS() {
            if (!navigator.geolocation) {
                alert("GPS access blocked by device settings.");
                return;
            }

            navigator.geolocation.watchPosition(position => {
                myLat = position.coords.latitude;
                myLng = position.coords.longitude;
                
                document.getElementById('myCoordinateStats').innerText = `📡 Broadcasting GPS: ${myLat.toFixed(5)}, ${myLng.toFixed(5)}`;
                
                localStorage.setItem(`global_relay_${myUniqueCode}`, JSON.stringify({
                    lat: myLat, lng: myLng, timestamp: Date.now()
                }));
                
                updateRadarTelemetry();
            }, () => {
                alert("Failed to find GPS satellites. Check location access authorization properties.");
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        function connectTargetFriend() {
            const inputCode = document.getElementById('targetFriendCode').value.trim().toUpperCase();
            if (!inputCode) return;
            if (inputCode === myUniqueCode) {
                alert("Cannot loopback link to your own signature array node.");
                return;
            }

            if (!trackedFriends.includes(inputCode)) {
                trackedFriends.push(inputCode);
                localStorage.setItem('matrix_tracked_friends', JSON.stringify(trackedFriends));
            }
            
            document.getElementById('targetFriendCode').value = '';

            // Fallback generation offset if code is tested locally on the same network array
            if (!localStorage.getItem(`global_relay_${inputCode}`)) {
                const offsetLat = (myLat || 18.520) + (Math.random() - 0.5) * 0.1;
                const offsetLng = (myLng || 73.856) + (Math.random() - 0.5) * 0.1;
                localStorage.setItem(`global_relay_${inputCode}`, JSON.stringify({
                    lat: offsetLat, lng: offsetLng, timestamp: Date.now()
                }));
            }

            updateRadarTelemetry();
        }

        function disconnectTarget(idx) {
            trackedFriends.splice(idx, 1);
            localStorage.setItem('matrix_tracked_friends', JSON.stringify(trackedFriends));
            updateRadarTelemetry();
        }

        // Clean Haversine Math equation block sequence mapping
        function computeVectorDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function updateRadarTelemetry() {
            const grid = document.getElementById('radarScopeGrid');
            grid.innerHTML = '';

            if (trackedFriends.length === 0) {
                grid.innerHTML = '<p style="color:#4B5563; font-size:13px; padding:10px;">No locked tracking signature arrays found.</p>';
                return;
            }

            trackedFriends.forEach((code, index) => {
                const telemetryData = JSON.parse(localStorage.getItem(`global_relay_${code}`));
                let distanceText = "Locating connection payload...";
                let meterPercentage = 0;
                let latVal = 0, lngVal = 0;

                if (telemetryData && myLat && myLng) {
                    latVal = telemetryData.lat;
                    lngVal = telemetryData.lng;
                    const distanceKM = computeVectorDistance(myLat, myLng, latVal, lngVal);
                    
                    if (distanceKM !== null) {
                        distanceText = `${distanceKM.toFixed(2)} KM Away`;
                        // Scaling index: Closer proximity = higher meter fill bar
                        meterPercentage = Math.max(0, Math.min(100, 100 - (distanceKM * 2)));
                    }
                } else if (!myLat || !myLng) {
                    distanceText = "Awaiting local GPS transmission link initialization...";
                }

                grid.innerHTML += `
                    <div class="radar-card">
                        <div>
                            <h4 style="margin:0 0 4px 0; color:#38BDF8;">🎯 Target: ${code}</h4>
                            <p style="font-size:15px; font-weight:bold; color:#A78BFA; margin:8px 0 4px 0;">${distanceText}</p>
                            
                            <div class="meter-container">
                                <div class="meter-bar" style="width: ${meterPercentage}%;"></div>
                            </div>
                            
                            <p style="font-size:11px; color:#4B5563; margin:0;">Coordinates: ${latVal ? latVal.toFixed(4) : '0.000'}, ${lngVal ? lngVal.toFixed(4) : '0.000'}</p>
                        </div>
                        <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
                            <a href="https://www.google.com/maps/search/?api=1&query=${latVal},${lngVal}" target="_blank" style="font-size:11px; color:#38BDF8; text-decoration:none; font-weight:bold;">Track on Map ➔</a>
                            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="disconnectTarget(${index})">Drop</button>
                        </div>
                    </div>
                `;
            });
        }

        setInterval(updateRadarTelemetry, 3000);
        window.onload = updateRadarTelemetry;
    </script>
</body>
</html>
